<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            padding: 50px 25px;
            border-radius: 25px;
            text-align: center;
            width: 80%;
        }

        h1 {
            color: #764ba2;
        }

        button {
            padding: 15px 30px;
            border: 0;
            border-radius: 30px;
            background: #667eea;
            color: white;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>✨ Welcome to My Website ✨</h1>

        <p>Hello! This is my first website made on my phone. 🌸</p>

        <button onclick="alert('Welcome! 💜')">
            Click Me
        </button>
    </div>

</body>
</html>
