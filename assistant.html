
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickGenius AI Assistant</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #f5edff, #ffeafa);
  min-height: 100vh;
  color: #302044;
}

header {
  padding: 17px 20px;
  background: rgba(255,255,255,0.85);
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 3px 15px #b99bc333;
}

.logo {
  font-size: 21px;
  font-weight: bold;
  color: #8b45c6;
}

.back {
  text-decoration: none;
  color: #8b45c6;
  font-weight: bold;
}

.container {
  max-width: 850px;
  margin: 25px auto;
  padding: 15px;
}

.heading {
  text-align: center;
  margin-bottom: 20px;
}

.heading h1 {
  font-size: 28px;
  color: #7136a5;
  margin-bottom: 8px;
}

.heading p {
  color: #806b91;
  font-size: 14px;
}

.chat-box {
  background: rgba(255,255,255,0.92);
  border-radius: 22px;
  padding: 18px;
  min-height: 390px;
  box-shadow: 0 8px 30px #8b45c622;
  display: flex;
  flex-direction: column;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 13px;
  border-bottom: 1px solid #f0e4fa;
}

.status {
  color: #7b48a4;
  font-size: 14px;
  font-weight: bold;
}

.actions button {
  border: none;
  background: #f4e8ff;
  color: #8142b2;
  padding: 8px 11px;
  border-radius: 9px;
  cursor: pointer;
  margin-left: 4px;
}

.messages {
  flex: 1;
  padding: 18px 0;
  overflow-y: auto;
  max-height: 430px;
}

.message {
  padding: 12px 15px;
  border-radius: 15px;
  margin-bottom: 12px;
  max-width: 85%;
  line-height: 1.5;
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.bot {
  background: #f2e6ff;
  color: #49315d;
  border-bottom-left-radius: 4px;
}

.user {
  background: linear-gradient(135deg, #a45bda, #e17ab9);
  color: white;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}

.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 15px;
}

.suggestions button {
  background: #fff7fd;
  border: 1px solid #e8cafa;
  color: #8246a9;
  padding: 9px 12px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 12px;
}

.input-area {
  display: flex;
  gap: 9px;
  border-top: 1px solid #f0e4fa;
  padding-top: 15px;
}

.input-area input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border: 1px solid #e4c9f5;
  border-radius: 13px;
  outline: none;
  font-size: 14px;
}

.input-area input:focus {
  border-color: #a45bda;
}

.send {
  background: linear-gradient(135deg, #9b4ed0, #dc75b8);
  color: white;
  border: none;
  padding: 0 20px;
  border-radius: 13px;
  font-weight: bold;
  cursor: pointer;
}

footer {
  text-align: center;
  padding: 22px;
  color: #927ca1;
  font-size: 12px;
}

@media(max-width: 500px) {
  .container { margin: 12px auto; padding: 10px; }
  .chat-box { padding: 13px; }
  .heading h1 { font-size: 24px; }
  .message { max-width: 92%; }
}
</style>
</head>

<body>

<header>
  <div class="logo">✨ QuickGenius</div>
  <a class="back" href="index.html">← Home</a>
</header>

<div class="container">

  <div class="heading">
    <h1>💜 AI Assistant</h1>
    <p>Your little smart helper for everyday ideas!</p>
  </div>

  <div class="chat-box">

    <div class="top-bar">
      <div class="status">● Assistant Demo</div>
      <div class="actions">
        <button onclick="newChat()">＋ New Chat</button>
        <button onclick="clearChat()">Clear</button>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="message bot">
        Hello! 👋 Welcome to QuickGenius!

        I'm your smart demo assistant. Ask me about coding, studies, ideas, or websites. ✨
      </div>
    </div>

    <div class="suggestions">
      <button onclick="askExample('Explain Python')">🐍 Learn Python</button>
      <button onclick="askExample('Give me project ideas')">💡 Project Ideas</button>
      <button onclick="askExample('How to make a website?')">🌐 Website Help</button>
      <button onclick="askExample('Give me study tips')">📚 Study Tips</button>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Ask me anything..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
      >
      <button class="send" onclick="sendMessage()">Send ➤</button>
    </div>

  </div>
</div>

<footer>
  Made with 💜 | Created by Shivangi Prajapati
  <br><br>
  QuickGenius © 2026
</footer>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("userInput");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function getReply(question) {
  const q = question.toLowerCase();

  if (q.includes("hello") || q.includes("hi") || q.includes("hey")) {
    return "Hello! 💜 Welcome to QuickGenius. What would you like to learn today?";
  }

  if (q.includes("python")) {
    return "🐍 Python is a beginner-friendly programming language.\n\nYou can use it for:\n• Web development\n• AI and Machine Learning\n• Automation\n• Data Science\n\nStart with variables, data types, conditions and loops!";
  }

  if (q.includes("project") || q.includes("idea")) {
    return "💡 Here are some beginner-friendly project ideas:\n\n1. Personal Portfolio Website\n2. Calculator App\n3. To-Do List\n4. Weather App\n5. Student Management System\n6. Nature Photo Gallery";
  }

  if (q.includes("website") || q.includes("html")) {
    return "🌐 To create a website, start with:\n\n1. HTML – Website structure\n2. CSS – Design and styling\n3. JavaScript – Interactive features\n\nYou can practice using Acode on your phone!";
  }

  if (q.includes("study") || q.includes("exam")) {
    return "📚 Some useful study tips:\n\n1. Make a simple daily timetable.\n2. Study one topic at a time.\n3. Practice questions regularly.\n4. Revise what you learned.\n5. Take short breaks.";
  }

  if (q.includes("javascript") || q.includes("js")) {
    return "✨ JavaScript makes websites interactive. It can handle button clicks, forms, calculations and much more. Start by learning variables, functions, conditions and events.";
  }

  if (q.includes("css")) {
    return "🎨 CSS is used to style websites. You can change colors, fonts, spacing, layouts, animations and make your website responsive.";
  }

  if (q.includes("thank")) {
    return "You're welcome! 💜 Keep learning and creating with QuickGenius!";
  }

  return "That's an interesting question! ✨ I'm currently a demo assistant, so I have limited prepared answers. A real AI connection can be added later to answer a wider range of questions.";
}

function sendMessage() {
  const question = input.value.trim();

  if (question === "") return;

  addMessage(question, "user");
  input.value = "";

  const reply = getReply(question);

  setTimeout(() => {
    addMessage(reply, "bot");
  }, 300);
}

function askExample(question) {
  input.value = question;
  sendMessage();
}

function clearChat() {
  messages.innerHTML = "";
  addMessage("Chat cleared! 💜 Ask me a new question.", "bot");
}

function newChat() {
  messages.innerHTML = "";
  addMessage("Hello again! 👋 Welcome to a fresh QuickGenius chat. What shall we explore today? ✨", "bot");
}
</script>

</body>
    </html>
