
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickGenius AI Assistant</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#fff0f6,#eee7ff);
    min-height: 100vh;
    padding: 15px;
}

.container {
    max-width: 600px;
    margin: 20px auto;
    background: white;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 5px 25px #00000012;
}

.header {
    background: linear-gradient(135deg,#8b5cf6,#c084fc);
    color: white;
    padding: 25px;
    text-align: center;
}

.header h1 {
    font-size: 25px;
}

.header p {
    margin-top: 8px;
}

.chat-area {
    height: 420px;
    overflow-y: auto;
    padding: 18px;
    background: #fdfaff;
}

.message {
    padding: 13px;
    margin: 12px 0;
    border-radius: 15px;
    max-width: 85%;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.bot {
    background: #eee7ff;
    color: #553399;
}

.user {
    background: #8b5cf6;
    color: white;
    margin-left: auto;
}

.input-area {
    display: flex;
    gap: 8px;
    padding: 15px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border: 2px solid #ddd6fe;
    border-radius: 12px;
    outline: none;
}

button {
    background: #8b5cf6;
    color: white;
    border: none;
    padding: 13px 17px;
    border-radius: 12px;
    cursor: pointer;
}

.back {
    display: block;
    text-align: center;
    padding: 15px;
    color: #8054d6;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🤖 QuickGenius AI</h1>
        <p>Your Smart AI Assistant ✨</p>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="message bot">
            Hello! 👋 Welcome to QuickGenius AI.
            <br>
            How can I help you today? 💜
        </div>
    </div>

    <div class="input-area">
        <input
            type="text"
            id="userInput"
            placeholder="Ask me anything..."
        >

        <button onclick="sendMessage()">Send</button>
    </div>

    <a href="index.html" class="back">
        ← Back to QuickGenius Home
    </a>

</div>

<script>
function sendMessage() {

    let input = document.getElementById("userInput");
    let chat = document.getElementById("chatArea");

    let message = input.value.trim();

    if (message === "") return;

    let userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = message;

    chat.appendChild(userMessage);

    input.value = "";

    let botMessage = document.createElement("div");
    botMessage.className = "message bot";
    botMessage.textContent =
        "Thanks for your question! 💜 This is currently a demo chat. Real AI connection will be added in the next step.";

    chat.appendChild(botMessage);

    chat.scrollTop = chat.scrollHeight;
}

document.getElementById("userInput")
.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
